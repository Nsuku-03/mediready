name: MediReady Patient Notifications

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read

concurrency:
  group: mediready-patient-notifications
  cancel-in-progress: false

jobs:
  send-notifications:
    runs-on: ubuntu-latest

    steps:
      - name: Download MediReady repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Firebase Admin
        run: pip install firebase-admin

      - name: Send patient notifications
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: python scripts/send_notifications.py
